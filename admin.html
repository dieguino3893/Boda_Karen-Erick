<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Invitados</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Panel Invitados</a>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Buscador -->
        <div class="input-group mb-3">
            <input type="text" id="search-name" class="form-control" placeholder="Buscar por nombre..." onkeyup="filtrarTabla()">
            <button class="btn btn-outline-secondary" onclick="filtrarTabla()">Buscar</button>
        </div>

        <!-- Tabla de invitados -->
        <div class="card">
            <div class="card-header bg-light">
                <h5>Lista de Invitados</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle" id="invitados-table">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Asistencia</th>
                                <th>Acompañantes</th>
                                <th>Mesa</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="invitados-tbody">
                            <!-- Se llenará dinámicamente con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

<div class="card section-qr">
  <div class="card-header bg-light">
    <h5>Buscar Invitado por QR</h5>
  </div>
  <div class="card-body">
<div id="qr-reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
    <div id="qr-result" class="mt-2"></div>
  </div>
</div>


    <!-- Toast para alertas -->
    <div id="alert-toast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-body">
                Mesa asignada correctamente!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>

    <!-- Bootstrap JS & dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- HTML5 QRCode JS -->
<script src="https://unpkg.com/html5-qrcode"></script>
    <!-- JS personalizado -->
    <script src="./js/admin.js"> </script>
</body>
</html>
